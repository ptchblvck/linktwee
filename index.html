<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="a simple linktree for the vtuber and content creator ptchblvck. They wanted to offer an alternative to linktree and created a simple html website">
    <title>ptchblvck linktwee</title>
</head>
<style>

    @media (prefers-color-scheme: dark) {
        body {
            background-color: rgb(15, 21, 40);
        }
        p {
            color: rgb(243, 245, 251);
        }
    }

    * {
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        display: grid;
        height: 100vh;
        grid-template-rows: auto 1fr auto;
    }

    header>p {
        font-size: x-small;
    }

    a {
        color: rgb(255, 33, 142);
    }

    a:hover {
        color: rgb(252, 216, 0);
    }

    a:visited {
        color: rgb(1, 148, 252);
    }

    h1 {
        margin: auto;
        font-size: 4rem;
        width: fit-content;
        background: -webkit-linear-gradient(0deg, rgb(255, 33, 142), rgb(1, 148, 252));
        background-clip: text;
        color: transparent;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    ul {
        list-style: none;
        padding-inline-start: 0;
    }

    .headingbox {
        width: 100%;
        display: flex;
        justify-content: center;
        
    }
  
</style>
<body>
    <header>
        <p>
            No AI was used to create this. Not even boilerplate, so this might suck a bit.
        </p>
    </header>
    <main>
        <div class="headingbox">

            <h1>ptchblvck</h1>
        </div>
        <ul>
            <li>
                <a href="https://twitch.tv/ptchblvck" target="_blank">
                <div>
                    <p>twitch</p>
                </div>
                </a>
            </li>
            <li>
                <a href="https://instagram.com/ptchblvck" target="_blank">
                <div>
                    <p>instagram</p>
                </div>
                </a>
            </li>
            <li>
                <a href="https://youtube.com/@ptchblvck" target="_blank">
                <div>
                    <p>youtube</p>
                </div>
                </a>
            </li>
            <li>
                <a href="https://x.com/ptchblvck_" target="_blank">
                <div>
                    <p>twitter/x</p>
                </div>
                </a>
            </li>
        </ul>
    </main>
    <footer>
        <p>
           © 2026 <a href="https://ptchblvck.com" target="_blank" >ptchblvck</a>
        </p>

</html>
